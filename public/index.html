<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Scramjet | Browse freely</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<header class="site-header">
			<div class="browser-tabs">
				<div id="tab-strip" class="tab-strip" aria-label="Open tabs">
					<button id="close-all" class="close-all" type="button" aria-label="Close all tabs" hidden>×</button>
					<button id="new-tab" class="tab-label" type="button" aria-label="Open a new tab">+</button>
				</div>
				<section class="home-status widget"><span class="widget-label">Status</span><strong><i></i> Proxy online</strong><small>Scramjet is ready to browse.</small></section>
			</div>
			<div id="browser-address" class="browser-address" hidden></div>
		</header>

		<main class="hero">
			<form id="sj-form">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
				<div class="search-shell">
					<span class="search-icon" aria-hidden="true">↗</span>
					<input id="sj-address" type="text" placeholder="Search or enter a web address" autocomplete="off" />
					<button type="submit" aria-label="Open destination">Go <span aria-hidden="true">↗</span></button>
				</div>
			</form>
			<div class="desc">
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>

		</main>

	</body>
</html>
